<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线IP信息查询工具，支持IPv4和IPv6格式校验、私有地址、回环地址、链路本地、多播地址识别，数据仅在浏览器本地处理。">
    <meta name="keywords" content="IP查询,IP格式校验,IPv4,IPv6,私有IP,内网IP,IP地址工具">
    <title>IP信息查询工具 - 在线校验IPv4和IPv6地址类型</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand" aria-label="DevMiniTools 首页">
            <span class="brand-dev">Dev</span><span class="brand-name">MiniTools</span>
        </a>
        <nav class="site-nav" aria-label="工具导航">
            <div class="nav-item">
                <span class="nav-label" tabindex="0">JSON</span>
                <div class="nav-dropdown">
                    <a href="json-format.html">JSON格式化</a>
                    <a href="convert.html">JSON转换</a>
                </div>
            </div>
            <div class="nav-item">
                <span class="nav-label" tabindex="0">图像</span>
                <div class="nav-dropdown">
                    <a href="image-compress.html">图片压缩</a>
                    <a href="image-convert.html">图片格式转换</a>
                    <a href="image-gif.html">图片合成 GIF</a>
                </div>
            </div>
            <div class="nav-item">
                <span class="nav-label" tabindex="0">调试</span>
                <div class="nav-dropdown">
                    <a href="diff.html">代码对比</a>
                    <a href="color-convert.html">颜色转换</a>
                    <a href="user-agent.html">User-Agent解析</a>
                    <a href="ip-lookup.html">IP信息查询</a>
                </div>
            </div>
            <div class="nav-item">
                <span class="nav-label" tabindex="0">文本</span>
                <div class="nav-dropdown">
                    <a href="markdown-preview.html">Markdown预览</a>
                    <a href="line-tools.html">多行文本处理</a>
                </div>
            </div>
        </nav>
        <span class="header-note">数据仅在浏览器本地处理，不上传服务器</span>
    </header>

    <main class="tool-shell">
        <section class="utility-workbench">
            <div class="utility-grid two-column">
                <article class="utility-panel">
                    <h2>输入 IP</h2>
                    <input id="ip-input" type="text" placeholder="例如：192.168.1.1 或 2001:db8::1">
                    <div class="button-group compact">
                        <button id="ip-lookup-btn" class="primary">查询</button>
                        <button data-ip-sample="192.168.1.1" class="secondary">私有 IPv4</button>
                        <button data-ip-sample="8.8.8.8" class="secondary">公网 IPv4</button>
                        <button data-ip-sample="::1" class="secondary">IPv6 回环</button>
                        <button id="ip-clear-btn" class="secondary">清空</button>
                    </div>
                    <p class="muted">本工具不联网查询地理位置，只做本地格式和地址类型判断。</p>
                </article>
                <article class="utility-panel">
                    <h2>查询结果</h2>
                    <div id="ip-result" class="result-list"></div>
                </article>
            </div>
            <div id="ip-message" class="json-message">等待输入 IP 地址。</div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="https://github.com/devminitools" target="_blank" rel="noopener">GitHub</a>
        </div>
    </footer>

    <script src="js/ip-lookup.js"></script>
</body>
</html>
