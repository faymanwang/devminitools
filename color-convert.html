<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线颜色转换工具，支持HEX、RGB、HSL颜色互转，自动生成CSS颜色值和颜色预览，数据仅在浏览器本地处理。">
    <meta name="keywords" content="颜色转换,HEX转RGB,RGB转HEX,HSL转换,CSS颜色">
    <title>颜色转换工具 - HEX RGB HSL 在线互转</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand" aria-label="DevMiniTools 首页">
            <span class="brand-dev">Dev</span><span class="brand-name">MiniTools</span>
        </a>
        <nav class="site-nav" aria-label="工具导航">
            <div class="nav-item">
                <span class="nav-label" tabindex="0">JSON</span>
                <div class="nav-dropdown">
                    <a href="json-format.html">JSON格式化</a>
                    <a href="convert.html">JSON转换</a>
                </div>
            </div>
            <div class="nav-item">
                <span class="nav-label" tabindex="0">图像</span>
                <div class="nav-dropdown">
                    <a href="image-compress.html">图片压缩</a>
                    <a href="image-convert.html">图片格式转换</a>
                    <a href="image-gif.html">图片合成 GIF</a>
                </div>
            </div>
            <div class="nav-item">
                <span class="nav-label" tabindex="0">调试</span>
                <div class="nav-dropdown">
                    <a href="diff.html">代码对比</a>
                    <a href="color-convert.html">颜色转换</a>
                    <a href="user-agent.html">User-Agent解析</a>
                    <a href="ip-lookup.html">IP信息查询</a>
                </div>
            </div>
            <div class="nav-item">
                <span class="nav-label" tabindex="0">文本</span>
                <div class="nav-dropdown">
                    <a href="markdown-preview.html">Markdown预览</a>
                    <a href="line-tools.html">多行文本处理</a>
                </div>
            </div>
        </nav>
        <span class="header-note">数据仅在浏览器本地处理，不上传服务器</span>
    </header>

    <main class="tool-shell">
        <section class="utility-workbench">
            <div class="utility-grid two-column">
                <article class="utility-panel">
                    <h2>输入颜色</h2>
                    <textarea id="color-input" class="utility-textarea" spellcheck="false" placeholder="#1677ff 或 rgb(22, 119, 255) 或 hsl(215, 100%, 54%)"></textarea>
                    <div class="button-group compact">
                        <button id="color-convert-btn" class="primary">转换</button>
                        <button id="color-sample-btn" class="secondary">示例</button>
                        <button id="color-clear-btn" class="secondary">清空</button>
                    </div>
                </article>

                <article class="utility-panel">
                    <h2>转换结果</h2>
                    <div id="color-preview" style="height: 56px; border-radius: 8px; border: 1px solid #e6eaf2; background: #fff;"></div>
                    <div class="result-list">
                        <div class="result-row"><span>HEX</span><strong id="color-hex-result">-</strong></div>
                        <div class="result-row"><span>RGB</span><strong id="color-rgb-result">-</strong></div>
                        <div class="result-row"><span>HSL</span><strong id="color-hsl-result">-</strong></div>
                    </div>
                    <div class="button-group compact">
                        <button id="color-copy-btn" class="secondary">复制结果</button>
                    </div>
                </article>
            </div>
            <div id="color-message" class="json-message">等待输入颜色。</div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="https://github.com/devminitools" target="_blank" rel="noopener">GitHub</a>
        </div>
    </footer>

    <script src="js/color-convert.js"></script>
</body>
</html>
